# Auralis Paper High Contrast for tmux — generated community fixture.
set -g status-style "fg=#1f1610,bg=#f3ede5"
set -g message-style "fg=#1f1610,bg=#f7f3ec"
set -g message-command-style "fg=#d45b3d,bg=#f7f3ec"
set -g pane-border-style "fg=#b9b0a3"
set -g pane-active-border-style "fg=#d45b3d"
