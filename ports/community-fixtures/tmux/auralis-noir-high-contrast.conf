# Auralis Noir High Contrast for tmux — generated community fixture.
set -g status-style "fg=#faf6ef,bg=#020305"
set -g message-style "fg=#faf6ef,bg=#030306"
set -g message-command-style "fg=#ff9550,bg=#030306"
set -g pane-border-style "fg=#494d57"
set -g pane-active-border-style "fg=#ff9550"
set -g window-status-style "fg=#faf6ef,bg=#020305"
set -g window-status-current-style "fg=#040508,bg=#ff9550,bold"
set -g mode-style "fg=#fcf8f1,bg=#286cab,bold"
