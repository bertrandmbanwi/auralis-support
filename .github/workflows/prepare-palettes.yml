name: Prepare palette package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Validate and prepare public palettes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate the public package and port manifest
        run: |
          node scripts/verify-palette-package.js
          node scripts/validate-community-port.js --init zed "$RUNNER_TEMP/port.json"
          node scripts/validate-community-port.js "$RUNNER_TEMP/port.json"
      - name: Create the review artifact without lifecycle hooks
        working-directory: packages/auralis-palettes
        run: |
          set -euo pipefail
          npm pack --ignore-scripts --json > "$RUNNER_TEMP/palette-pack.json"
          filename="$(node -e "const p=require(process.env.RUNNER_TEMP+'/palette-pack.json'); if(p.length!==1 || !/^[a-z0-9.-]+\\.tgz$/.test(p[0].filename)) throw Error('Invalid tarball'); console.log(p[0].filename)")"
          sha256sum "$filename" > SHA256SUMS
          {
            echo '### Palette package ready for review'
            echo "Commit: $GITHUB_SHA"
            echo "Preparation run: $GITHUB_RUN_ID"
            echo '```text'
            cat SHA256SUMS
            echo '```'
            echo 'This workflow cannot publish. Review the artifact before choosing the separate publication workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/palette-pack.json"
      - name: Upload the package and checksum for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-palettes
          path: |
            packages/auralis-palettes/*.tgz
            packages/auralis-palettes/SHA256SUMS
          if-no-files-found: error
