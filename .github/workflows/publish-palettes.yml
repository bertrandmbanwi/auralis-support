name: Prepare Syntalume Palette Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Inspect and package public palettes
    runs-on: ubuntu-latest
    outputs:
      filename: ${{ steps.package.outputs.filename }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Publish must run from main, got $GITHUB_REF."
            exit 1
          fi
      - name: Checkout reviewed public package
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Inspect and create tarball without lifecycle hooks
        id: package
        working-directory: packages/auralis-palettes
        run: |
          set -euo pipefail
          npm pack --ignore-scripts --json > "$RUNNER_TEMP/palette-pack.json"
          filename="$(node -e "const p=require(process.env.RUNNER_TEMP+'/palette-pack.json'); if(p.length!==1 || !/^[a-z0-9.-]+\\.tgz$/.test(p[0].filename)) throw Error('Invalid tarball'); console.log(p[0].filename)")"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$filename" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/palette-pack.json"
      - name: Upload reviewed package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-palettes
          path: packages/auralis-palettes/*.tgz
          if-no-files-found: error
  publish:
    name: Publish verified tarball with npm trusted publishing
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node for npm trusted publishing
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download reviewed package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-palettes
      - name: Verify digest and publish without lifecycle hooks
        env:
          PACKAGE_FILE: ${{ needs.build.outputs.filename }}
          PACKAGE_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          echo "$PACKAGE_SHA256  $PACKAGE_FILE" | sha256sum --check --strict
          npm publish "$PACKAGE_FILE" --ignore-scripts --access public
