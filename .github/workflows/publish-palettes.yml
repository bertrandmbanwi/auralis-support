name: Prepare Syntalume Palette Package

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @auralis-labs/palettes
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Publish must run from main, got $GITHUB_REF."
            exit 1
          fi

      - name: Checkout reviewed public package
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node for npm trusted publishing
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Inspect publish contents
        working-directory: packages/auralis-palettes
        run: npm pack --dry-run

      - name: Publish with short-lived OIDC credentials and provenance
        working-directory: packages/auralis-palettes
        run: npm publish --access public
