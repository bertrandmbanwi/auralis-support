name: Publish reviewed Syntalume palette artifact

on:
  workflow_dispatch:
    inputs:
      prepare_run_id:
        description: Successful main-branch Prepare palette package run ID
        required: true
        type: string
      sha256:
        description: Reviewed tarball SHA-256 from that preparation run
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-palettes
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the selected preparation run
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful preparation of this main commit
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$PREPARE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid preparation run ID" >&2; exit 1; }
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]] || { echo "Invalid reviewed SHA-256" >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREPARE_RUN_ID" > "$RUNNER_TEMP/preparation.json"
          node <<'NODE'
          const fs = require('node:fs');
          const run = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/preparation.json', 'utf8'));
          if (run.path !== '.github/workflows/prepare-palettes.yml' ||
              run.conclusion !== 'success' || run.head_branch !== 'main' ||
              run.head_sha !== process.env.GITHUB_SHA ||
              !['push', 'workflow_dispatch'].includes(run.event) ||
              run.repository?.full_name !== process.env.GITHUB_REPOSITORY) {
            throw new Error('Select a successful trusted preparation run for this exact main commit.');
          }
          NODE
          {
            echo '### Requested palette publication'
            echo "Preparation run: $PREPARE_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Reviewed SHA-256: $EXPECTED_SHA256"
          } >> "$GITHUB_STEP_SUMMARY"
  publish:
    name: Approve and publish the reviewed tarball
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Setup Node for npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download the reviewed preparation artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-palettes
          run-id: ${{ inputs.prepare_run_id }}
          github-token: ${{ github.token }}
      - name: Verify digest and publish without lifecycle hooks
        env:
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(auralis-labs-palettes-*.tgz)
          test "${#packages[@]}" -eq 1
          filename="${packages[0]}"
          [[ "$filename" =~ ^auralis-labs-palettes-[a-z0-9.-]+\.tgz$ ]] || { echo "Invalid package filename" >&2; exit 1; }
          printf '%s  %s\n' "$EXPECTED_SHA256" "$filename" | sha256sum --check --strict
          npm publish "$filename" --ignore-scripts --access public
